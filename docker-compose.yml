services:

  mongodb:
    image: mongo:8
    container_name: eventflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:4.3.1
    container_name: eventflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

  order-service:
    build:
      context: ./order-service
    container_name: eventflow-order-service
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/eventflow
      KAFKA_BROKER: kafka:29092
    depends_on:
      - mongodb
      - kafka

  processing-service:
    build:
      context: ./processing-service
    container_name: eventflow-processing-service
    environment:
      MONGO_URI: mongodb://mongodb:27017/eventflow
      KAFKA_BROKER: kafka:29092
    depends_on:
      - mongodb
      - kafka

  frontend:
    build:
      context: ./frontend
    container_name: eventflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - order-service

volumes:
  mongo_data: